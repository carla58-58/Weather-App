<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛅Weather App by Carla Tasinazzo⛅</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Weather Icons CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <!-- Font Awesome for date/time icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="/css/weather.css">
</head>
<body>
<!-- Animated Clouds Background -->
<div class="clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="cloud cloud5"></div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-11 col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body text-center">
                    <h1 class="card-title">Weather in <span th:text="${city}">City</span>, <span th:text="${country}">Country</span></h1>
                    
                    <!-- Date and Time Information -->
                    <div class="datetime-info mb-3">
                        <p class="date-text mb-1"><i class="far fa-calendar-alt"></i> <span th:text="${currentDate}">Date</span></p>
                        <p class="time-text mb-1"><i class="far fa-clock"></i> <span th:text="${currentTime}">Time</span></p>
                    </div>
                    
                    <span th:classappend="${weatherIcon} + ' weather-icon'"></span>
                    <p class="card-text"><strong>Description:</strong> <span th:text="${weatherDescription}">Description</span></p>
                    <p class="card-text"><strong>Temperature:</strong> <span th:text="${temperature}">Temperature</span>°C</p>
                    <p class="card-text"><strong>Humidity:</strong> <span th:text="${humidity}">Humidity</span>%</p>
                    <p class="card-text"><strong>Wind Speed:</strong> <span th:text="${windSpeed}">Wind Speed</span> m/s</p>
                    
                    <!-- Forecast Section -->
                    <div th:if="${forecast != null and !forecast.empty}" class="forecast-section mt-4">
                        <h3 class="forecast-title">Weekly Temperature Forecast</h3>
                        
                        <!-- Weather Chart -->
                        <div class="weather-chart">
                            <div class="chart-container">
                                <div class="temperature-scale">
                                    <div class="scale-line" th:each="temp : ${#numbers.sequence(35, 0, -5)}">
                                        <span class="scale-label" th:text="${temp} + '°'">30°</span>
                                    </div>
                                </div>
                                
                                <div class="chart-bars">
                                    <div th:each="day : ${forecast}" class="day-column">
                                        <div class="temperature-bar-container">
                                            <div class="temperature-bar" 
                                                 th:style="'height: ' + ${day.temperature * 3} + 'px; background: linear-gradient(to top, #ff6b6b, #4ecdc4);'">
                                                <span class="temp-label" th:text="${day.temperature} + '°C'">20°C</span>
                                            </div>
                                        </div>
                                        
                                        <div class="day-info">
                                            <div class="day-name" th:text="${day.dayName}">Mon</div>
                                            <div class="day-date" th:text="${day.date}">Jan 15</div>
                                            <div class="weather-icon-small">
                                                <span th:classappend="${day.weatherIcon}"></span>
                                            </div>
                                            <div class="weather-desc" th:text="${day.description}">Sunny</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Additional weather details -->
                            <div class="weather-details-grid mt-3">
                                <div th:each="day : ${forecast}" class="day-details">
                                    <h6 th:text="${day.dayName}">Monday</h6>
                                    <div class="detail-row">
                                        <small><i class="fas fa-tint"></i> <span th:text="${day.humidity}">65</span>%</small>
                                        <small><i class="fas fa-wind"></i> <span th:text="${day.windSpeed}">3.2</span> m/s</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <a href="/" class="btn btn-secondary btn-block">Back</a>
                    <div th:if="${error}" class="alert alert-danger mt-3">
                        <p>Error: <span th:text="${error}"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
