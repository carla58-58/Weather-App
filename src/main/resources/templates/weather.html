<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⛅Weather App by Carla Tasinazzo⛅</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Weather Icons CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <!-- Font Awesome for date/time icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <!-- Chart.js for line charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" type="text/css" href="/css/weather.css">
</head>
<body>
<!-- Animated Clouds Background -->
<div class="clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="cloud cloud5"></div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-11 col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body text-center">
                    <h1 class="card-title">Weather in <span th:text="${city}">City</span>, <span th:text="${country}">Country</span></h1>
                    
                    <!-- Date and Time Information -->
                    <div class="datetime-info mb-3">
                        <p class="date-text mb-1"><i class="far fa-calendar-alt"></i> <span th:text="${currentDate}">Date</span></p>
                        <p class="time-text mb-1"><i class="far fa-clock"></i> <span th:text="${currentTime}">Time</span></p>
                    </div>
                    
                    <span th:classappend="${weatherIcon} + ' weather-icon'"></span>
                    <p class="card-text"><strong>Description:</strong> <span th:text="${weatherDescription}">Description</span></p>
                    <p class="card-text"><strong>Temperature:</strong> <span th:text="${temperature}">Temperature</span>°C</p>
                    <p class="card-text"><strong>Humidity:</strong> <span th:text="${humidity}">Humidity</span>%</p>
                    <p class="card-text"><strong>Wind Speed:</strong> <span th:text="${windSpeed}">Wind Speed</span> m/s</p>
                    
                    <!-- Forecast Section -->
                    <div th:if="${forecast != null and !forecast.empty}" class="forecast-section mt-4">
                        <h3 class="forecast-title">7-Day Weather Trends</h3>
                        
                        <!-- Weather Line Charts -->
                        <div class="weather-charts">
                            <!-- Combined Chart -->
                            <div class="chart-container mb-4">
                                <h5 class="chart-title">Weather Trends - Click legend to toggle data</h5>
                                <canvas id="combinedChart" width="400" height="300"></canvas>
                            </div>
                            
                            <!-- Daily Weather Summary -->
                            <div class="daily-summary">
                                <h5 class="chart-title">Daily Weather Summary</h5>
                                <div class="summary-grid">
                                    <div th:each="day : ${forecast}" class="day-summary">
                                        <div class="day-header">
                                            <strong th:text="${day.dayName}">Mon</strong>
                                            <small th:text="${day.date}">Jan 15</small>
                                        </div>
                                        <div class="weather-icon-summary">
                                            <span th:classappend="${day.weatherIcon}"></span>
                                        </div>
                                        <div class="weather-desc-summary" th:text="${day.description}">Sunny</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <!-- Chart Data Script -->
                        <script th:inline="javascript">
                            document.addEventListener('DOMContentLoaded', function() {
                                // Extract data from Thymeleaf
                                const forecastData = /*[[${forecast}]]*/ [];
                                
                                const labels = [];
                                const temperatures = [];
                                const humidity = [];
                                const windSpeed = [];
                                
                                forecastData.forEach(day => {
                                    labels.push(day.dayName + '\n' + day.date);
                                    temperatures.push(day.temperature);
                                    humidity.push(day.humidity);
                                    windSpeed.push(day.windSpeed);
                                });
                                
                                // Combined Chart with multiple Y-axes
                                new Chart(document.getElementById('combinedChart'), {
                                    type: 'line',
                                    data: {
                                        labels: labels,
                                        datasets: [{
                                            label: 'Temperature (°C)',
                                            data: temperatures,
                                            borderColor: '#ff6b6b',
                                            backgroundColor: 'rgba(255, 107, 107, 0.1)',
                                            borderWidth: 3,
                                            fill: false,
                                            tension: 0.4,
                                            pointBackgroundColor: '#ff6b6b',
                                            pointBorderColor: '#fff',
                                            pointBorderWidth: 2,
                                            pointRadius: 6,
                                            yAxisID: 'y'
                                        }, {
                                            label: 'Humidity (%)',
                                            data: humidity,
                                            borderColor: '#4ecdc4',
                                            backgroundColor: 'rgba(78, 205, 196, 0.1)',
                                            borderWidth: 3,
                                            fill: false,
                                            tension: 0.4,
                                            pointBackgroundColor: '#4ecdc4',
                                            pointBorderColor: '#fff',
                                            pointBorderWidth: 2,
                                            pointRadius: 6,
                                            yAxisID: 'y1'
                                        }, {
                                            label: 'Wind Speed (m/s)',
                                            data: windSpeed,
                                            borderColor: '#ffc107',
                                            backgroundColor: 'rgba(255, 193, 7, 0.1)',
                                            borderWidth: 3,
                                            fill: false,
                                            tension: 0.4,
                                            pointBackgroundColor: '#ffc107',
                                            pointBorderColor: '#fff',
                                            pointBorderWidth: 2,
                                            pointRadius: 6,
                                            yAxisID: 'y2'
                                        }]
                                    },
                                    options: {
                                        responsive: true,
                                        maintainAspectRatio: false,
                                        interaction: {
                                            mode: 'index',
                                            intersect: false,
                                        },
                                        plugins: {
                                            legend: {
                                                display: true,
                                                position: 'top',
                                                labels: {
                                                    color: '#f8f9fa',
                                                    font: {
                                                        size: 14,
                                                        weight: 'bold'
                                                    },
                                                    padding: 20,
                                                    usePointStyle: true,
                                                    pointStyle: 'line'
                                                },
                                                onClick: function(e, legendItem, legend) {
                                                    const index = legendItem.datasetIndex;
                                                    const ci = legend.chart;
                                                    const meta = ci.getDatasetMeta(index);
                                                    
                                                    // Toggle dataset visibility
                                                    meta.hidden = meta.hidden === null ? !ci.data.datasets[index].hidden : null;
                                                    ci.update();
                                                }
                                            },
                                            tooltip: {
                                                mode: 'index',
                                                intersect: false,
                                                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                                                titleColor: '#f8f9fa',
                                                bodyColor: '#f8f9fa',
                                                borderColor: 'rgba(255, 255, 255, 0.3)',
                                                borderWidth: 1,
                                                cornerRadius: 8,
                                                displayColors: true,
                                                titleFont: {
                                                    size: 14,
                                                    weight: 'bold'
                                                },
                                                bodyFont: {
                                                    size: 12
                                                }
                                            }
                                        },
                                        scales: {
                                            x: {
                                                ticks: {
                                                    color: '#f8f9fa',
                                                    font: {
                                                        size: 12,
                                                        weight: 'bold'
                                                    }
                                                },
                                                grid: {
                                                    color: 'rgba(255, 255, 255, 0.1)',
                                                    drawBorder: false
                                                }
                                            },
                                            y: {
                                                type: 'linear',
                                                display: true,
                                                position: 'left',
                                                title: {
                                                    display: true,
                                                    text: 'Temperature (°C)',
                                                    color: '#ff6b6b',
                                                    font: {
                                                        size: 13,
                                                        weight: 'bold'
                                                    }
                                                },
                                                ticks: {
                                                    color: '#ff6b6b',
                                                    font: {
                                                        size: 11,
                                                        weight: 'bold'
                                                    }
                                                },
                                                grid: {
                                                    color: 'rgba(255, 107, 107, 0.1)',
                                                    drawBorder: false
                                                }
                                            },
                                            y1: {
                                                type: 'linear',
                                                display: true,
                                                position: 'right',
                                                min: 0,
                                                max: 100,
                                                title: {
                                                    display: true,
                                                    text: 'Humidity (%)',
                                                    color: '#4ecdc4',
                                                    font: {
                                                        size: 13,
                                                        weight: 'bold'
                                                    }
                                                },
                                                ticks: {
                                                    color: '#4ecdc4',
                                                    font: {
                                                        size: 11,
                                                        weight: 'bold'
                                                    }
                                                },
                                                grid: {
                                                    drawOnChartArea: false,
                                                    color: 'rgba(78, 205, 196, 0.1)',
                                                    drawBorder: false
                                                }
                                            },
                                            y2: {
                                                type: 'linear',
                                                display: false, // Hidden by default, shows when wind data is visible
                                                position: 'right',
                                                min: 0,
                                                title: {
                                                    display: true,
                                                    text: 'Wind Speed (m/s)',
                                                    color: '#ffc107',
                                                    font: {
                                                        size: 13,
                                                        weight: 'bold'
                                                    }
                                                },
                                                ticks: {
                                                    color: '#ffc107',
                                                    font: {
                                                        size: 11,
                                                        weight: 'bold'
                                                    }
                                                },
                                                grid: {
                                                    drawOnChartArea: false,
                                                    color: 'rgba(255, 193, 7, 0.1)',
                                                    drawBorder: false
                                                }
                                            }
                                        }
                                    }
                                });
                            });
                        </script>
                    </div>
                    
                    <a href="/" class="btn btn-secondary btn-block">Back</a>
                    <div th:if="${error}" class="alert alert-danger mt-3">
                        <p>Error: <span th:text="${error}"></span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
