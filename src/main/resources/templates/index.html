<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <!-- Bootstrap CSS -->
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <!-- Weather Icons CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/weather-icons/2.0.10/css/weather-icons.min.css">
    <link rel="stylesheet" type="text/css" href="/css/index.css">
</head>
<body>
<!-- Animated Clouds Background -->
<div class="clouds">
    <div class="cloud cloud1"></div>
    <div class="cloud cloud2"></div>
    <div class="cloud cloud3"></div>
    <div class="cloud cloud4"></div>
    <div class="cloud cloud5"></div>
</div>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-11 col-md-8 col-lg-6">
            <div class="card">
                <div class="card-body">
                    <h1 class="card-title text-center">Weather App</h1>
                    <form action="/weather" method="get">
                        <div class="form-group">
                            <div class="autocomplete-container" style="position: relative;">
                                <input type="text" class="form-control" id="cityInput" name="city" placeholder="Start typing a city name (e.g., Melbourne)" required autocomplete="off">
                                <div id="autocomplete-list" class="autocomplete-items"></div>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary btn-block">Get Weather</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS and dependencies -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

<!-- Autocomplete JavaScript -->
<script src="/js/autocomplete.js"></script>
</body>
</html>
